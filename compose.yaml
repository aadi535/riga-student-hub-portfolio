services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studenthub
      POSTGRES_USER: studenthub
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - hub_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenthub -d studenthub"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/studenthub
      DATABASE_USERNAME: studenthub
      COOKIE_SECURE: "false"
    depends_on:
      database:
        condition: service_healthy
volumes:
  hub_database:
